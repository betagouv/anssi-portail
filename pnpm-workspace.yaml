# _c.f._ https://pnpm.io/settings

color: always
packages:
  - 'axios'
  - 'back'
  - 'front'
  - 'front/lib-svelte'
  - 'mise-a-jour-financements'
  - 'demande-diag'
  - 'comparaison-grist'
  - 'regles-eslint'

minimumReleaseAge: 10080 # 7 jours (exprimé en minutes)
preferFrozenLockfile: true
strictDepBuilds: false

overrides:
  '@babel/core@<=7.29.0': '>=7.29.6'
  'brace-expansion@<1.1.13': '5.0.9'
  'esbuild@>=0.27.3 <0.28.1': '>=0.28.1'
  'lodash@>=4.0.0 <=4.17.22': '>=4.17.23'
  'picomatch@>=4.0.0 <4.0.4': '>=4.0.4'
  'postcss@<8.5.10': '>=8.5.26'
  'shell-quote@>=1.1.0 <=1.8.3': '>=1.8.4'
  'svelte@<=5.55.6': '>=5.55.9'
  'vite@<=6.4.2': '6.4.3'
  'vitest@<4.1.0': '>=4.1.0'
  'yaml@>=2.0.0 <2.8.3': '>=2.8.3'

ignoredBuiltDependencies:
  - '@lab-anssi/lib'
  - '@lab-anssi/ui-kit'
  - '@parcel/watcher'
  - '@sentry/cli'
  - bcrypt
  - esbuild

catalog:
  axios: ^1.18.0
  entities: ^8.0.0
  isomorphic-dompurify: ^3.22.0
  prettier: 3.9.6
  svelte: 5.56.8
  tsx: ^4.23.12

minimumReleaseAgeExclude:
  - '@lab-anssi/ui-kit'
  # Renovate security update: axios@1.18.0
  - axios@1.18.0
  # Renovate security update: dompurify@3.4.12 || 3.4.13
  - dompurify@3.4.12 || 3.4.13
  # Renovate security update: sharp@0.35.0
  - sharp@0.35.0
  # Renovate security update: pdfjs-dist@6.2.108
  - pdfjs-dist@6.2.108
