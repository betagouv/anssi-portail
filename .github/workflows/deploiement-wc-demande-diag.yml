name: Déploiement WebComponent demande de diag
permissions: {}

on:
  workflow_dispatch: # Pour activer le déclenchement manuel

jobs:
  deploiement:
    runs-on: ubuntu-latest
    name: WebComponent Demande de diag
    environment: WEB_COMPONENTS
    steps:
      - name: Cloner le dépôt Git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configurer Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Installe pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5

      - name: Récupérer la version
        run: echo release_version=$(pnpm -F demande-diag exec node -p "require('./package.json').version") >> $GITHUB_ENV

      - name: Construis la lib
        env:
          VERSION: ${{ env.release_version }}
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter demande-diag build:demo
          pnpm --filter demande-diag build:prod

      - name: Installer et configurer la CLI de S3cmd
        uses: s3-actions/s3cmd@f6b9af96d329795d7ba6199c21ef84bf1211c940 # v3.0.0
        with:
          provider: clevercloud
          access_key: ${{ secrets.CLEVER_S3_ACCESS_KEY }}
          secret_key: ${{ secrets.CLEVER_S3_SECRET_KEY }}

      - name: Envoyer les fichiers en démo
        run: |
          s3cmd put --acl-public --mime-type='application/javascript' ./demande-diag/dist-demo/demande-diag.iife.js "s3://messervicescyber-web-components/${release_version}/demo/"
          s3cmd put --acl-public --mime-type='text/css' ./demande-diag/dist-demo/demande-diag.css "s3://messervicescyber-web-components/${release_version}/demo/"
          s3cmd put --acl-public --mime-type='text/plain' ./demande-diag/dist-demo/demande-diag.php "s3://messervicescyber-web-components/${release_version}/demo/"

      - name: Envoyer les fichiers en prod
        run: |
          s3cmd put --acl-public --mime-type='application/javascript' ./demande-diag/dist-prod/demande-diag.iife.js "s3://messervicescyber-web-components/${release_version}/prod/"
          s3cmd put --acl-public --mime-type='text/css' ./demande-diag/dist-prod/demande-diag.css "s3://messervicescyber-web-components/${release_version}/prod/"
          s3cmd put --acl-public --mime-type='text/plain' ./demande-diag/dist-prod/demande-diag.php "s3://messervicescyber-web-components/${release_version}/prod/"
