name: Déploie des buckets Cellar
run-name: Compare et recopie des buckets
permissions: {}

on:
  workflow_call:
    secrets:
      CELLAR_ACCESS_KEY_ID:
        required: true
      CELLAR_SECRET_ACCESS_KEY:
        required: true
      GUIDES_BUCKET_SOURCE:
        required: true
      GUIDES_BUCKET_CIBLE:
        required: true
      MQC_API_DOCUMENTS_TOKEN:
        required: true
      MQC_API_DOCUMENTS_URL:
        required: true
      ANTIVIRUS_DOMAINE:
        required: true
      ANTIVIRUS_PORT:
        required: true
      ANTIVIRUS_CLIENT_CERTIFICAT:
        required: true
      ANTIVIRUS_CLIENT_CLE:
        required: true
      ANTIVIRUS_SERVEUR_CERTIFICAT:
        required: true

jobs:
  compare-les-buckets:
    runs-on: ubuntu-latest
    environment: DEPLOIEMENT_GUIDES
    steps:
      - name: Mets en place le cache pour les bases de données de signatures de virus
        id: cache-CVDs
        uses: actions/cache@v6
        with:
          path: |
            /var/lib/clamav/*/bytecode.cvd
            /var/lib/clamav/*/daily.cvd
            /var/lib/clamav/*/main.cvd
          key: ${{ runner.os }}-CVDs

      - name: Prépare rclone
        uses: AnimMouse/setup-rclone@26ef2133e09fd383329a1d4c1fbe6a71db1976c9 # v1.12.0

      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [cellar]
          type = s3
          provider = Other
          access_key_id = ${{ secrets.CELLAR_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.CELLAR_SECRET_ACCESS_KEY }}
          endpoint = cellar-c2.services.clever-cloud.com
          acl = public-read
          EOF

      - name: Compare les buckets
        id: check
        run: |
          mkdir -p resultats

          rclone check \
            cellar:${{ secrets.GUIDES_BUCKET_SOURCE }} \
            cellar:${{ secrets.GUIDES_BUCKET_CIBLE }} \
            --exclude .backup_proof \
            --differ resultats/modifications.txt \
            --missing-on-dst resultats/ajouts.txt \
            --missing-on-src resultats/suppressions.txt \
            --log-file resultats/rclone.log \
            || RC=$?

          echo "rc=${RC:-0}"
          cat resultats/rclone.log
          echo "rc=${RC:-0}" >> $GITHUB_OUTPUT

      - name: Installer et configurer la CLI de S3cmd
        uses: s3-actions/s3cmd@f6b9af96d329795d7ba6199c21ef84bf1211c940 # v3.0.0
        with:
          provider: clevercloud
          access_key: ${{ secrets.CELLAR_ACCESS_KEY_ID }}
          secret_key: ${{ secrets.CELLAR_SECRET_ACCESS_KEY }}

      - name: Configure client antivirus
        run: |
          sudo apt install -y socat clamav-daemon

          local_port=4242

          cat <<_EOF_ >clamav.conf
          TCPAddr 127.0.0.1
          TCPSocket $local_port
          _EOF_

          echo "${{ secrets.ANTIVIRUS_CLIENT_CERTIFICAT }}" > client.crt
          echo "${{ secrets.ANTIVIRUS_CLIENT_CLE }}" > client.key
          echo "${{ secrets.ANTIVIRUS_SERVEUR_CERTIFICAT }}" > s.crt
          socat \
            "TCP-LISTEN:$local_port",reuseaddr,fork \
            "OPENSSL:${{ secrets.ANTIVIRUS_DOMAINE }}:${{ secrets.ANTIVIRUS_PORT }},cert=$(pwd)/client.crt,key=$(pwd)/client.key,cafile=$(pwd)/s.crt,verify=1" &

      - name: Scan antivirus déporté
        run: |
          # `clamdscan` retourne une erreur en cas de fichier malveillant ;
          # Pour continuer à scanner tous les fichiers, on souhaite ne pas quitter le script à la première commande qui échoue,
          # et on réactive ce comportement une fois tous les fichiers scannés.
          set +e

          while IFS= read -r fichierAScanner
            do
              [ -z "$fichierAScanner" ] && continue
              s3cmd --quiet get "s3://messervicescyber-guides-travail/$fichierAScanner" - \
                | clamdscan --config clamav.conf - \
                | grep -E "Infected files: [^0]" && echo "$fichierAScanner" >> fichiersMalveillants.txt
            done < <(cat resultats/ajouts.txt <(echo "") resultats/modifications.txt)

          set -e
          if [ -s fichiersMalveillants.txt ]; then
            echo "🐞 Fichiers malveillants :"
            cat fichiersMalveillants.txt
            exit 1
          else
            echo "✅ Aucun fichier malveillant détecté"
            exit 0
          fi

      - name: Generate GitHub Summary
        run: |
          echo "## 🔍 Prévisualisation des différences S3" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          DIFF=$(wc -l < resultats/modifications.txt 2>/dev/null || echo 0)
          MISS=$(wc -l < resultats/ajouts.txt 2>/dev/null || echo 0)
          EXTRA=$(wc -l < resultats/suppressions.txt 2>/dev/null || echo 0)

          echo "### 📊 Résumé" >> $GITHUB_STEP_SUMMARY
          echo "- ❌ Fichiers modifiés : $DIFF" >> $GITHUB_STEP_SUMMARY
          echo "- ➕ Fichiers ajoutés : $MISS" >> $GITHUB_STEP_SUMMARY
          echo "- ➖ Fichiers supprimés : $EXTRA" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          print_section () {
            TITLE=$1
            FILE=$2

            echo "### $TITLE" >> $GITHUB_STEP_SUMMARY

            if [ -s "$FILE" ]; then
              echo '```' >> $GITHUB_STEP_SUMMARY
              head -n 100 "$FILE" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY

              TOTAL=$(wc -l < "$FILE")
              if [ "$TOTAL" -gt 100 ]; then
                echo "_... $TOTAL fichiers au total (affichage limité à 100)_" >> $GITHUB_STEP_SUMMARY
              fi
            else
              echo "✅ Aucun" >> $GITHUB_STEP_SUMMARY
            fi

            echo "" >> $GITHUB_STEP_SUMMARY
          }

          print_section "❌ Fichiers modifiés" resultats/modifications.txt
          print_section "➕ Fichiers ajoutés" resultats/ajouts.txt
          print_section "➖ Fichiers supprimés" resultats/suppressions.txt

      - name: Génère les empreintes des fichiers
        run: |
          rclone md5sum cellar:${{ secrets.GUIDES_BUCKET_SOURCE }} | sort > empreintes-cellar.txt

      - name: Sauvegarde les empreintes des fichiers sources
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: empreintes-cellar
          path: |
            empreintes-cellar.txt
            resultats/*.txt

      - name: Fail only on real error
        if: steps.check.outputs.rc != '0' && steps.check.outputs.rc != '1'
        run: |
          echo "❌ Erreur technique rclone"
          exit 1

  recopie-source-vers-destination:
    runs-on: ubuntu-latest
    needs: compare-les-buckets
    environment: DEPLOIEMENT_GUIDES
    steps:
      - name: Prépare rclone
        uses: AnimMouse/setup-rclone@26ef2133e09fd383329a1d4c1fbe6a71db1976c9 # v1.12.0

      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [cellar]
          type = s3
          provider = Other
          access_key_id = ${{ secrets.CELLAR_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.CELLAR_SECRET_ACCESS_KEY }}
          endpoint = cellar-c2.services.clever-cloud.com
          acl = public-read
          EOF

      - name: Récupère les empreintes sources
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: empreintes-cellar

      - name: Regénère les empreintes des fichiers
        run: |
          rclone md5sum cellar:${{ secrets.GUIDES_BUCKET_SOURCE }} | sort > nouvelles-empreintes-cellar.txt

      - name: Compare les empreintes
        id: compare-empreintes-cellar
        run: |
          if diff empreintes-cellar.txt nouvelles-empreintes-cellar.txt; then
            echo "✅ Source stable — sync allowed"
            echo "resultat=ok" >> $GITHUB_OUTPUT
          else
            echo "❌ La source a changé depuis la comparaison"
            echo "resultat=erreur" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Recopie le bucket source vers le bucket de destination
        if: steps.compare-empreintes-cellar.outputs.resultat == 'ok'
        run: |
          rclone sync --exclude .backup_proof \
            cellar:${{ secrets.GUIDES_BUCKET_SOURCE }} \
            cellar:${{ secrets.GUIDES_BUCKET_CIBLE }} \

  notifie-changement:
    runs-on: ubuntu-latest
    needs: recopie-source-vers-destination
    environment: DEPLOIEMENT_GUIDES
    steps:
      - name: Récupère les résultats
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: empreintes-cellar

      - name: Identifie les fichiers modifiés
        run: |
          grep -hv '\.avif$' resultats/modifications.txt resultats/suppressions.txt resultats/ajouts.txt > fichiers.txt || true
          NB_FICHIERS=$(wc -l < fichiers.txt 2>/dev/null || echo 0)
          if [ "$NB_FICHIERS" -gt 0 ]; then
            echo "Appel MQC nécessaire..." >> $GITHUB_STEP_SUMMARY
            JSON=$(
              jq -n \
              --rawfile modifications resultats/modifications.txt \
              --rawfile suppressions resultats/suppressions.txt \
              --rawfile ajouts resultats/ajouts.txt '
              {
                fichiers_modifies:
                    ($modifications
                      | split("\n")
                      | map(select(length > 0 and endswith(".pdf")))
                      ),

                      fichiers_supprimes:
                          ($suppressions
                            | split("\n")
                            | map(select(length > 0 and endswith(".pdf")))
                            ),

                      fichiers_ajoutes:
                          ($ajouts
                            | split("\n")
                            | map(select(length > 0 and endswith(".pdf")))
                            )
              }'
            )
            TOKEN=${{ secrets.MQC_API_DOCUMENTS_TOKEN }}
            URL=${{ secrets.MQC_API_DOCUMENTS_URL }}
            curl -X POST "$URL" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $TOKEN" \
              -d "$JSON" --fail || exit 1

          else
            echo "Pas besoin d'appeler MQC..." >> $GITHUB_STEP_SUMMARY
          fi
