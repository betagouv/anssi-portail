name: L'intégration continue
permissions: {}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Construction du site
    runs-on: ubuntu-26.04
    steps:
      - name: Cloner le dépôt Git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: (TOUS) Installe les dépendances
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          require-lockfile: true

      - name: Vérifie le formatage
        run: pnpm format:check

      - name: Vérifie le code mort
        run: pnpm unused:check

      - name: Exécute les tests
        run: pnpm test

      - name: Construis le back
        run: pnpm --filter @anssi-portail/back build

      - name: Construis la lib Svelte
        run: pnpm --filter @anssi-portail/svelte build

      - name: Setup Ruby
        uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/front/Gemfile
        with:
          bundler-cache: true
          cache-version: 0

      - name: Construis avec Jekyll
        run: |
          bundle config set --local path './front/vendor/bundle'
          bundle exec --gemfile=./front/Gemfile jekyll build -s ./front -d ./front/_site
        env:
          JEKYLL_ENV: production
