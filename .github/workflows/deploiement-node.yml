name: Déploiement Node
permissions: {}

on:
  workflow_call:
    inputs:
      nom:
        required: true
        type: string
      environnement:
        required: true
        type: string
    secrets:
      CLEVER_CLOUD_SECRET:
        required: true
      CLEVER_CLOUD_TOKEN:
        required: true
      CLEVER_CLOUD_ID_APP:
        required: true

jobs:
  deploiement-node:
    runs-on: ubuntu-26.04
    name: ${{ inputs.nom }}
    environment: ${{ inputs.environnement }}
    steps:
      - name: Cloner le dépôt Git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Cloner l'intégralité du dépôt, pour ne pas avoir de « shallow repo » rejeté par Clever
          persist-credentials: false

      - name: (TOUS) Installe les dépendances
        id: pnpm-setup
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          require-lockfile: true
          node-version-file: '.nvmrc'

      - name: Setup Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/front/Gemfile
        with:
          bundler-cache: true
          cache-version: 0

      - name: Connecter à Clever
        env:
          CLEVER_SECRET: ${{ secrets.CLEVER_CLOUD_SECRET }}
          CLEVER_TOKEN: ${{ secrets.CLEVER_CLOUD_TOKEN }}
          ID_APP: ${{ secrets.CLEVER_CLOUD_ID_APP }}
        run: |
          pnpm exec clever link "$ID_APP"

          pnpm exec clever env |
            grep -E \
              -e '^SENTRY_AUTH_TOKEN=' \
              -e '^SENTRY_PROJET=' \
              -e '^SENTRY_URL=' \
              -e '^DELAI_AFFICHAGE_AVIS_UTILISATEUR=' \
              -e '^FEATURE_FLAG_NIS2_CYFUN23=' \
              -e '^GOOGLE_SEARCH_CONSOLE_VERIFICATION=' \
              -e '^MATOMO_ID=' \
              -e '^MATOMO_URL_TAG_MANAGER=' \
              -e '^SENTRY_DSN=' \
              -e '^URL_BASE_MSC=' \
              -e '^SENTRY_ENVIRONNEMENT=' |
            tr -d '"' | while IFS='=' read -r key value; do
              echo "::add-mask::$value"
              echo "$key=$value" >> "$GITHUB_ENV"
            done

      - name: Construis la lib Svelte
        run: |
          pnpm --filter @anssi-portail/svelte build

      - name: Construis avec Jekyll
        run: |
          bundle config set --local path './front/vendor/bundle'
          bundle exec --gemfile=./front/Gemfile jekyll build -s ./front -d ./front/_site
        env:
          JEKYLL_ENV: production

      - name: Déployer sur Clever Cloud
        env:
          CLEVER_SECRET: ${{ secrets.CLEVER_CLOUD_SECRET }}
          CLEVER_TOKEN: ${{ secrets.CLEVER_CLOUD_TOKEN }}
          ID_APP: ${{ secrets.CLEVER_CLOUD_ID_APP }}
          NODE_VERSION: ${{ steps.pnpm-setup.outputs.runtime-version }}
        run: |
          git config --global user.email "contact@messervicescyber.beta.gouv.fr"
          git config --global user.name "MesServicesCyber"
          git add --force front/_site
          git commit -m "Ajoute le site généré"
          pnpm exec clever env set CC_NODE_VERSION "$NODE_VERSION"
          pnpm exec clever deploy --force --same-commit-policy=rebuild
