name: Déploiement WebComponent
permissions: {}

on:
  workflow_call:
    inputs:
      package:
        description: 'Nom du package pnpm'
        type: string
        required: true
      repertoire:
        description: 'Répertoire du WebComponent'
        type: string
        required: true
      nom:
        description: 'Nom affiché du WebComponent'
        type: string
        required: true
      environnement:
        required: true
        type: string
    secrets:
      CLEVER_S3_ACCESS_KEY:
        required: true
      CLEVER_S3_SECRET_KEY:
        required: true

jobs:
  deploiement:
    name: ${{ inputs.nom }}
    runs-on: ubuntu-26.04
    environment: ${{ inputs.environnement }}

    steps:
      - name: Cloner le dépôt Git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Installer les dépendances
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          require-lockfile: true
          node-version-file: '.nvmrc'

      - name: Récupérer la version
        run: |
          echo "release_version=$(pnpm -F '${{ inputs.package }}' exec node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Construire la lib
        env:
          VERSION: ${{ env.release_version }}
        run: |
          pnpm --filter '${{ inputs.package }}' build:demo
          pnpm --filter '${{ inputs.package }}' build:prod

      - name: Envoyer les fichiers en démo
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLEVER_S3_ACCESS_KEY }}
          # La CLI AWS exige une région, mais Cellar n'en utilise pas la valeur.
          AWS_DEFAULT_REGION: default
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLEVER_S3_SECRET_KEY }}
          CELLAR_ENDPOINT: https://cellar-c2.services.clever-cloud.com
          REPERTOIRE_COMPOSANT: ${{ inputs.repertoire }}
          NOM_COMPOSANT: ${{ inputs.package }}
        run: |
          upload() {
            aws s3 cp "$1" "$2" \
              --endpoint-url "$CELLAR_ENDPOINT" \
              --acl public-read \
              --content-type "$3" \
              --only-show-errors
          }

          upload \
            "./${REPERTOIRE_COMPOSANT}/dist-demo/${NOM_COMPOSANT}.iife.js" \
            "s3://messervicescyber-web-components/${release_version}/demo/" \
            'application/javascript'

          upload \
            "./${REPERTOIRE_COMPOSANT}/dist-demo/${NOM_COMPOSANT}.css" \
            "s3://messervicescyber-web-components/${release_version}/demo/" \
            'text/css'

          upload \
            "./${REPERTOIRE_COMPOSANT}/dist-demo/${NOM_COMPOSANT}.php" \
            "s3://messervicescyber-web-components/${release_version}/demo/" \
            'text/plain'

      - name: Envoyer les fichiers en prod
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLEVER_S3_ACCESS_KEY }}
          # La CLI AWS exige une région, mais Cellar n'en utilise pas la valeur.
          AWS_DEFAULT_REGION: default
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLEVER_S3_SECRET_KEY }}
          CELLAR_ENDPOINT: https://cellar-c2.services.clever-cloud.com
          REPERTOIRE_COMPOSANT: ${{ inputs.repertoire }}
          NOM_COMPOSANT: ${{ inputs.package }}
        run: |
          upload() {
            aws s3 cp "$1" "$2" \
              --endpoint-url "$CELLAR_ENDPOINT" \
              --acl public-read \
              --content-type "$3" \
              --only-show-errors
          }

          upload \
            "./${REPERTOIRE_COMPOSANT}/dist-prod/${NOM_COMPOSANT}.iife.js" \
            "s3://messervicescyber-web-components/${release_version}/prod/" \
            'application/javascript'

          upload \
            "./${REPERTOIRE_COMPOSANT}/dist-prod/${NOM_COMPOSANT}.css" \
            "s3://messervicescyber-web-components/${release_version}/prod/" \
            'text/css'

          upload \
            "./${REPERTOIRE_COMPOSANT}/dist-prod/${NOM_COMPOSANT}.php" \
            "s3://messervicescyber-web-components/${release_version}/prod/" \
            'text/plain'
