exclude = "pnpm-lock.yaml"

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
    { id = "check-yaml" },
    { id = "check-added-large-files" },
]

[[repos]]
repo = "local"
hooks = [
    { id = "format", name = "format", entry = "pnpm exec prettier --write --ignore-unknown", language = "system", pass_filenames = true, stages = [ "commit" ] },
]
