services:
  app:
    build:
      context: .
    env_file:
      - .env
    ports:
      - '3000:3000'
    depends_on:
      - db

  db:
    image: postgres:18
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - '5432:5432'
    volumes:
      - dbvol18:/var/lib/postgresql/18/docker

volumes:
  dbvol18:
    driver: local
